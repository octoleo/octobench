name: Octobench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install validation and benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sysbench fio openssl pciutils usbutils dmidecode lm-sensors rsync xdg-user-dirs python3 shellcheck
      - name: Check shell syntax and style
        run: |
          bash -n src/octobench tests/smoke.sh
          shellcheck src/octobench tests/smoke.sh
      - name: Run isolated functional regressions
        run: python3 -m unittest discover -s tests -v
      - name: Exercise real tools through the one-command entry point
        run: bash tests/smoke.sh
