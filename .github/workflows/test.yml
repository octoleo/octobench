name: Octobench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 sysbench fio gcc openssl pciutils usbutils dmidecode lm-sensors rsync xdg-user-dirs shellcheck
      - name: Check shell syntax and style
        run: |
          bash -n src/octobench tests/smoke.sh
          shellcheck src/octobench tests/smoke.sh
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Exercise real benchmark tools and reports
        run: bash tests/smoke.sh
